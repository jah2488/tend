[package]
name = "tend"
version = "0.2.5"
edition = "2021"
description = "A small TUI that keeps your Claude Code sessions in view: which are working, which need you, which are done."

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
anyhow = "1"
libc = "0.2"

[profile.release]
lto = true
strip = true
